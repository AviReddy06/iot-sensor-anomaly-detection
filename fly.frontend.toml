app = "iot-anomaly-web"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.frontend"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[services]]
  protocol = "tcp"
  internal_port = 8080
  ports = [
    {port = 80, handlers = ["http"]},
    {port = 443, handlers = ["tls", "http"]}
  ]