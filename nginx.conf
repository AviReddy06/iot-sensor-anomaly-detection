server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend https://iot-anomaly-api.fly.dev;
        proxy_pass $backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Handle backend not ready
        proxy_intercept_errors on;
        error_page 502 503 504 /api-error.html;
    }

    location /ws/ {
        resolver 127.0.0.11 valid=10s;
        set $backend wss://iot-anomaly-api.fly.dev;
        proxy_pass $backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Custom error page for API errors
    location = /api-error.html {
        internal;
        return 503 '{"error": "Backend service temporarily unavailable", "retry": true}';
        add_header Content-Type application/json;
    }
}