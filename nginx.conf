# Fly.io nginx config for frontend with API proxy
# Resolver must be in http context for Fly.io internal DNS

# Resolver for Fly.io internal DNS (must be in http context)
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend
    location /api/ {
        # Use internal Fly.io hostname (.internal not .fly.dev)
        set $backend http://iot-anomaly-api.internal;
        proxy_pass $backend/api/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Handle backend not ready
        proxy_intercept_errors on;
        error_page 502 503 504 /api-error.json;
    }

    # Proxy WebSocket connections to backend
    location /ws/ {
        set $backend ws://iot-anomaly-api.internal;
        proxy_pass $backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # WebSocket timeouts
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Custom error page for API errors
    location = /api-error.json {
        internal;
        return 503 '{"error": "Backend service temporarily unavailable", "retry": true}';
        add_header Content-Type application/json;
        add_header Access-Control-Allow-Origin *;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}