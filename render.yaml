version: "1"
services:
  - type: web
    name: iot-anomaly-backend
    env: python
    buildCommand: "pip install -r requirements.txt && pip install -r requirements-web.txt"
    startCommand: "cd backend && uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DB_PATH
        value: /opt/render/project/src/data/iot_anomaly.db
      - key: SERIAL_PORT
        value: auto

  - type: web
    name: iot-anomaly-frontend
    env: static
    buildCommand: "cd frontend && npm ci && npm run build"
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html